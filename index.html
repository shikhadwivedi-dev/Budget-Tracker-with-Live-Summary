<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Budget Tracker - Shikha Dwivedi</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="wrap">
  <h1>Budget Tracker</h1>
  <p class="sub">Add income and expenses. Totals and chart update live.</p>

  <section class="card" aria-labelledby="add-title">
    <h2 id="add-title">Add Transaction</h2>
    <form id="form" novalidate>
      <div class="grid">
        <div>
          <label for="desc">Description</label>
          <input id="desc" name="desc" type="text" placeholder="e.g. Salary, Groceries" aria-describedby="desc-error" autocomplete="off">
          <p class="error" id="desc-error" aria-live="polite"></p>
        </div>
        <div>
          <label for="amount">Amount (₹)</label>
          <input id="amount" name="amount" type="number" min="1" step="0.01" placeholder="e.g. 500" aria-describedby="amount-error" inputmode="decimal">
          <p class="error" id="amount-error" aria-live="polite"></p>
        </div>
        <div>
          <label for="type">Type</label>
          <select id="type" name="type">
            <option value="expense">Expense</option>
            <option value="income">Income</option>
          </select>
        </div>
        <div>
          <label for="category">Category</label>
          <select id="category" name="category" aria-describedby="category-error">
            <option value="">Choose category</option>
            <option>Salary</option>
            <option>Food</option>
            <option>Rent</option>
            <option>Transport</option>
            <option>Shopping</option>
            <option>Health</option>
            <option>Other</option>
          </select>
          <p class="error" id="category-error" aria-live="polite"></p>
        </div>
        <div>
          <label for="date">Date</label>
          <input id="date" name="date" type="date">
        </div>
      </div>
      <button type="submit" id="submitBtn">Add Transaction</button>
      <button type="button" id="cancelBtn" hidden>Cancel Edit</button>
      <p id="form-status" aria-live="polite"></p>
    </form>
  </section>

  <section class="summary" aria-label="Summary">
    <div class="stat income-stat"><span>Income</span><strong id="totalIncome">₹0</strong></div>
    <div class="stat expense-stat"><span>Spending</span><strong id="totalExpense">₹0</strong></div>
    <div class="stat balance-stat"><span>Balance</span><strong id="balance">₹0</strong></div>
  </section>

  <section class="card" aria-labelledby="chart-title">
    <h2 id="chart-title">Spending by Category</h2>
    <p id="chart-summary" class="sr-only">Chart summary will update here.</p>
    <div id="chart" class="chart" role="img" aria-labelledby="chart-title chart-summary"></div>
    <p id="chart-empty">No expenses yet. Add an expense to see the chart.</p>
  </section>

  <section class="card" aria-labelledby="list-title">
    <h2 id="list-title">Transactions</h2>
    <div class="filters">
      <label for="filter">Filter</label>
      <select id="filter">
        <option value="all">All</option>
        <option value="income">Income only</option>
        <option value="expense">Expense only</option>
      </select>
      <button type="button" id="clearBtn">Clear All</button>
    </div>
    <ul id="list"></ul>
    <p id="list-empty">No transactions yet.</p>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
